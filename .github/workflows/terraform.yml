name: terraform

on:
  pull_request:
    paths:
      - "modules/**"
      - "examples/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "modules/**"
      - "examples/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.5"

      - name: fmt
        run: terraform fmt -check -recursive

      # The modules can't be validated standalone, so we validate the minimal
      # fixture, which instantiates them. No cloud creds (-backend=false).
      - name: init (no backend)
        working-directory: examples/minimal
        run: terraform init -backend=false

      - name: validate
        working-directory: examples/minimal
        run: terraform validate
