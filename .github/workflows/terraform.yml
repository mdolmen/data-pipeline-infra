name: terraform

on:
  pull_request:
    paths:
      - "modules/**"
      - "examples/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "modules/**"
      - "examples/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.5"

      - name: fmt
        run: terraform fmt -check -recursive

      # The modules can't be validated standalone, so we validate the minimal
      # fixture, which instantiates them. No cloud creds (-backend=false).
      - name: init (no backend)
        working-directory: examples/minimal
        run: terraform init -backend=false

      - name: validate
        working-directory: examples/minimal
        run: terraform validate

      # Logic tests: mocked provider, `command = plan` — no credentials, no cloud
      # calls, seconds to run. Per module rather than against the fixture, because
      # assertions can only reach resources in the root module of the
      # configuration under test; from examples/minimal everything worth asserting
      # sits inside module.pipeline and is unreachable.
      - name: test (pipeline)
        working-directory: modules/pipeline
        run: |
          terraform init -backend=false
          terraform test

      - name: test (worker-job)
        working-directory: modules/worker-job
        run: |
          terraform init -backend=false
          terraform test

      - name: test (observability)
        working-directory: modules/observability
        run: |
          terraform init -backend=false
          terraform test
